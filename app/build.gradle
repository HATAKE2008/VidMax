plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    // 🔥 Added: KSP and Hilt plugins for Room & Dependency Injection
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
}

android {
    compileSdk 35
    namespace "com.vidmax.player"

    defaultConfig {
        applicationId "com.vidmax.player"
        minSdk 24
        targetSdk 35
        // 🔥 Version from CI env (release.yml) → auto-updates on each release.
        // Local builds without the env vars fall back to 1 / "1.0".
        versionCode = System.getenv("VERSION_CODE")?.toInteger() ?: 1
        versionName = System.getenv("VERSION_NAME") ?: "1.0"

        // 🔥 Last.fm API key — CI env → local.properties → empty (empty = iTunes charts fallback)
        def localProps = new Properties()
        def localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) {
            localPropsFile.withInputStream { localProps.load(it) }
        }
        def lastfmKey = System.getenv("LASTFM_API_KEY") ?: localProps.getProperty("LASTFM_API_KEY") ?: ""
        buildConfigField "String", "LASTFM_API_KEY", "\"$lastfmKey\""
    }

    // 🔥 GitHub Action ক্র্যাশ বন্ধ করার ম্যাজিক ব্লক
    lint {
        abortOnError = false
        checkReleaseBuilds = false
        disable "GradleDependency", "OldTargetApi", "SelectedPhotoAccess", "IconLauncherShape", "MonochromeLauncherIcon", "IconLocation", "IconDuplicates", "ModifierParameter", "UseOfNonLambdaOffsetOverload"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "vidmax.keystore")
            storePassword System.getenv("STORE_PASS") ?: "vidmax123"
            keyAlias System.getenv("KEY_ALIAS") ?: "vidmax"
            keyPassword System.getenv("KEY_PASS") ?: "vidmax123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // 🔥 R8 code shrinking + resource shrinking — much smaller APK
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // 🔥 Added: coreLibraryDesugaringEnabled for NewPipe Extractor (Requires for minSdk < 33)
        coreLibraryDesugaringEnabled true 
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                // BouncyCastle post-quantum parameter blobs — unused (SMB only needs AES/CMAC)
                'org/bouncycastle/pqc/**'
            ]
        }
        jniLibs {
            useLegacyPackaging true
        }
    }

    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }
}

dependencies {
    // 🔥 FIXED: Core Library Desugaring for NewPipe NIO APIs (ডট এর বদলে কোলন দেওয়া হয়েছে)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'

    // 🔥 Updated: Core and Lifecycle (Performance & Stability)
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    
    // 🔥 Updated: Activity Compose
    implementation 'androidx.activity:activity-compose:1.9.3'

    // 🔥 Updated: Jetpack Compose to Latest Stable (1.7.5)
    implementation 'androidx.compose.runtime:runtime:1.7.5'
    implementation 'androidx.compose.runtime:runtime-saveable:1.7.5'
    implementation 'androidx.compose.ui:ui:1.7.5'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.5'
    implementation 'androidx.compose.foundation:foundation:1.7.5'
    
    // 🔥 Updated: Material 3 to Latest Stable
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.material:material-icons-core:1.7.5'
    implementation 'androidx.compose.material:material-icons-extended:1.7.5'

    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    
    implementation 'androidx.media3:media3-session:1.4.1'
 
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // 🔥 Coil বাদ দিয়ে Glide Compose যুক্ত করা হলো (রকেট স্পিড থাম্বনেইল ক্যাশিং এর জন্য)
    implementation 'com.github.bumptech.glide:compose:1.0.0-beta01'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'

    // ==============================================================
    // 🔥 VIDMAX MUSIC STREAMING DEPENDENCIES (PHASE 1) 🔥
    // ==============================================================

    // NewPipe Extractor — YouTube search + online streaming
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.3'

    // OkHttp — NewPipe Downloader এর জন্য
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // Room — Local play history save
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Hilt — Dependency Injection
    implementation 'com.google.dagger:hilt-android:2.51.1'
    ksp 'com.google.dagger:hilt-compiler:2.51.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // ==============================================================
    // 🔥 NETWORK STREAMING DEPENDENCIES (SMB / FTP / WebDAV)
    // ==============================================================

    // SMB 2/3 protocol client
    implementation 'com.hierynomus:smbj:0.14.0'

    // FTP protocol client
    implementation 'commons-net:commons-net:3.12.0'

    // WebDAV client (sardine-android)
    implementation('com.github.thegrizzlylabs:sardine-android:0.8') {
        exclude group: 'xpp3', module: 'xpp3'
    }

    // Local HTTP proxy server for seekable streaming
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
