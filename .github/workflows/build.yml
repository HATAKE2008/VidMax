name: Build VidMax APK

on:
  push:
    branches:
      - new-feature
      - video-screeen-new
      - 260823-feat-network-streaming
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout VidMax
      uses: actions/checkout@v4

    - name: Download MPV .so files
      run: |
        APK_URL=$(curl -s https://api.github.com/repos/mpv-android/mpv-android/releases/latest \
          | grep "browser_download_url" \
          | grep "arm64-v8a" \
          | grep -v "api29" \
          | head -1 \
          | cut -d '"' -f 4)
        echo "Downloading: $APK_URL"
        curl -L "$APK_URL" -o mpv.apk
        unzip -o mpv.apk "lib/arm64-v8a/*.so" -d mpv_extracted
        mkdir -p app/src/main/jniLibs/arm64-v8a
        cp mpv_extracted/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
        echo "Copied .so files:"
        ls -la app/src/main/jniLibs/arm64-v8a/

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Setup Keystore (secret or auto-generated fallback)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding keystore from repo secret..."
          echo "$KEYSTORE_BASE64" | base64 -d > vidmax.keystore
        else
          echo "No KEYSTORE_BASE64 secret found — generating a local signing keystore..."
          keytool -genkeypair -v \
            -keystore vidmax.keystore \
            -storepass vidmax123 \
            -keypass vidmax123 \
            -alias vidmax \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VidMax, OU=VidMax, O=VidMax, L=Internet, ST=Internet, C=US"
        fi
        ls -la vidmax.keystore

    - name: Build Signed APK
      id: gradle_build
      shell: bash
      run: |
        set -o pipefail
        ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
        status=${PIPESTATUS[0]}
        echo "exitcode=$status" >> "$GITHUB_OUTPUT"
        exit $status
      env:
        GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"
        KEYSTORE_PATH: ${{ github.workspace }}/vidmax.keystore
        STORE_PASS: vidmax123
        KEY_ALIAS: vidmax
        KEY_PASS: vidmax123
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

    - name: Print Build Log Tail (on failure)
      if: failure()
      run: |
        echo "===== BUILD FAILED — last 80 lines of Gradle output ====="
        tail -n 80 build.log || true

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: VidMax-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Upload Full Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: VidMax-Build-Log
        path: build.log
        if-no-files-found: ignore
