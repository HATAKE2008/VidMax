name: Release VidMax APK

# 🔥 Release banano 2 vabe:
#   1) Tag push koro → `git tag v1.0.0` + `git push origin v1.0.0` (recommended)
#   2) Actions tab → "Release VidMax APK" → Run workflow (manual dispatch)
# Build, signing, release creation — sob automatic.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0). Empty = auto from tag/build time'
        required: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VidMax
        uses: actions/checkout@v4

      - name: Download MPV .so files
        run: |
          APK_URL=$(curl -s https://api.github.com/repos/mpv-android/mpv-android/releases/latest \
            | grep "browser_download_url" \
            | grep "arm64-v8a" \
            | grep -v "api29" \
            | head -1 \
            | cut -d '"' -f 4)
          echo "Downloading: $APK_URL"
          curl -L "$APK_URL" -o mpv.apk
          unzip -o mpv.apk "lib/arm64-v8a/*.so" -d mpv_extracted
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp mpv_extracted/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          echo "Copied .so files:"
          ls app/src/main/jniLibs/arm64-v8a/

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > vidmax.keystore

      - name: Resolve release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v$(date +%Y%m%d.%H%M%S)"
          fi
          VERSION_NAME="${VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$VERSION_CODE" -gt 2147483647 ]; then VERSION_CODE=2147483647; fi
          echo "Resolved: version=$VERSION version_name=$VERSION_NAME version_code=$VERSION_CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build Signed APK
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"
          KEYSTORE_PATH: ${{ github.workspace }}/vidmax.keystore
          STORE_PASS: vidmax123
          KEY_ALIAS: vidmax
          KEY_PASS: vidmax123
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Rename APK with version
        run: |
          cd app/build/outputs/apk/release/
          for f in *.apk; do
            mv "$f" "VidMax-${{ steps.version.outputs.version }}-release.apk"
          done
          ls -la

      - name: Build release notes from commits
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline --no-merges "$PREV_TAG"..HEAD)
          else
            NOTES=$(git log --oneline --no-merges -20)
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "VidMax ${{ steps.version.outputs.version }}"
          body: |
            📱 VidMax ${{ steps.version.outputs.version }} is here!

            ## Download
            - **APK**: VidMax-${{ steps.version.outputs.version }}-release.apk

            ## What's new
            - Improved video library navigation and interactions
            - Consistent long-press actions (Delete, Share, etc.) across Videos, Folder, Favorites and other video screens
            - Improved pull-to-refresh behavior
            - Advanced sorting for large libraries (Newest/Oldest, Name A-Z/Z-A, Largest, Longest)
            - Unified Grid/List view control with automatic 2-3 column grid layout
            - Dedicated improved search experience with history
            - One-click video screenshot capture from the player menu
            - Telegram community integration
            - Settings Backup & Restore
            - General performance, UI and stability improvements

            ## Commits
            ${{ steps.notes.outputs.notes }}

            ## Install
            1. Download the APK
            2. Allow "Install from unknown sources" if prompted
            3. Open and update over the existing install to keep your data

            ## Update checking
            The app automatically detects this release and shows an
            in-app update notification (check Settings → Updates).
          files: app/build/outputs/apk/release/*.apk
